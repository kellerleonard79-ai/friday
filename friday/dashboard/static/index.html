<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>F.R.I.D.A.Y.</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">

  <!-- Installable. On the Mac this becomes a dock icon and a chrome-less
       window; on the phone, a home-screen app. That is most of what makes the
       dashboard feel like the thing rather than a browser tab it is easy to
       lose behind twenty others.

       crossorigin="use-credentials" is load-bearing: a manifest is fetched
       with credentials OMITTED by default, and every route here needs the auth
       cookie. Without it the manifest 401s and the install prompt never
       appears — with no error anywhere the user can see. -->
  <link rel="manifest" href="/static/manifest.webmanifest" crossorigin="use-credentials">
  <meta name="theme-color" content="#04141B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Friday">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="saved-flash"></div>

  <!-- Today is the homepage; everything else lives behind this settings
       button as an off-canvas drawer, on every viewport width — not just
       mobile. Clicking the wordmark returns to Today from anywhere in it. -->
  <header class="topbar">
    <button class="settings-btn" id="hamburger-btn" aria-label="Open settings" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <button class="topbar-title" id="topbar-home">F.R.I.D.A.Y.</button>
  </header>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="logo">SETTINGS</div>
    <div class="logo-sub">CONFIGURATION</div>
    <nav>
      <a class="nav-item" data-route="ai">AI Model</a>
      <a class="nav-item" data-route="persona">Persona</a>
      <a class="nav-item" data-route="integrations">Integrations</a>
      <a class="nav-item" data-route="schedule">Schedule</a>
      <a class="nav-item" data-route="calendar">Calendar</a>
      <a class="nav-item" data-route="notifications">Notifications</a>
      <a class="nav-item" data-route="power">Wake Schedule</a>
      <a class="nav-item" data-route="voice">Voice</a>
      <a class="nav-item" data-route="about">About</a>
    </nav>
    <div class="sidebar-footer">
      <span class="dot" id="sidebar-dot"></span>
      <span id="sidebar-status">CONNECTING</span>
    </div>
  </aside>

  <main id="page"></main>

  <!-- ─── Page templates ────────────────────────────────────────────────── -->

  <template id="page-today">
    <!-- The ticker tape. Full-bleed against main's own padding (see the CSS
         note on .ticker-marquee) rather than boxed in a panel — a scrolling
         strip with visible edges reads as a broken widget, not a ticker.
         Hidden until the first fetch answers, so an empty strip never
         flashes before there is anything to show. -->
    <div class="ticker-marquee hidden" id="ticker-marquee">
      <div class="ticker-track" id="ticker-track"></div>
    </div>

    <!-- The visor: the schedule card on the left, the hub and the
         conversation in the middle, the to-do list on the right. Nothing is
         rotated and nothing is framed — the panels' own corner brackets are
         the only structure. .hud-stage is the positioning context the ONLINE
         strip anchors to. -->
    <div class="hud-stage">
      <div class="home-grid">
        <!-- Left flank. Nothing populates the list yet — deliberately blank,
             same footprint as the card on the other side so the visor stays
             symmetric about the hub. -->
        <div class="home-todo hud-flank">
          <section class="panel">
            <h2>TO-DO LIST</h2>
            <div id="todo-list"></div>
          </section>
        </div>

        <div class="home-center">
          <!-- The hub. The wordmark sits dead centre with the ripple rings
               behind it; the rings are wider than the text, so what actually
               shows is a pair of arcs flanking it. -->
          <!-- Four concentric arc pairs, in a 400-unit square centred on
               (200, 200). Each pair spans 110 degrees above and 110 below,
               leaving a gap at three and nine o'clock that the wordmark
               sits in — so the arcs frame the name rather than crossing
               it. One <g> per radius, because a state animation scales the
               top and bottom halves of a ring as one thing.

               data-state is written by hubState() in app.js and is the
               whole of the animation: idle breathes, thinking ripples
               outward, speaking pulses. Pure CSS from there — no canvas,
               no library, no requestAnimationFrame. -->
          <div class="hub" id="hub" data-state="idle">
            <div class="hub-rings" aria-hidden="true">
              <svg class="hub-arcs" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" focusable="false">
                <g class="hub-arc">
                  <path d="M 278.64 144.93 A 96 96 0 0 0 121.36 144.93"/>
                  <path d="M 121.36 255.07 A 96 96 0 0 0 278.64 255.07"/>
                </g>
                <g class="hub-arc">
                  <path d="M 301.58 128.87 A 124 124 0 0 0 98.42 128.87"/>
                  <path d="M 98.42 271.13 A 124 124 0 0 0 301.58 271.13"/>
                </g>
                <g class="hub-arc">
                  <path d="M 324.52 112.81 A 152 152 0 0 0 75.48 112.81"/>
                  <path d="M 75.48 287.19 A 152 152 0 0 0 324.52 287.19"/>
                </g>
                <g class="hub-arc">
                  <path d="M 347.46 96.75 A 180 180 0 0 0 52.54 96.75"/>
                  <path d="M 52.54 303.25 A 180 180 0 0 0 347.46 303.25"/>
                </g>
              </svg>
            </div>
            <div class="hub-word">F.R.I.D.A.Y.</div>
          </div>

          <!-- Chat. The same conversation as Telegram, over loopback, so it
               works with the Wi-Fi switched off — which is most of the school
               day. No bubbles and no panel chrome: Friday's turns are marked
               by a glowing left rule, the user's by being right-aligned, and
               the composer is a single lit underline. -->
          <section class="chat-panel home-chat-panel">
            <div class="chat-log" id="chat-log">
              <div class="hint">Loading…</div>
            </div>
            <form class="chat-composer" id="chat-form" autocomplete="off">
              <input type="text" class="input" id="chat-input" placeholder="Message" autocomplete="off">
              <button class="btn btn-primary" type="submit" id="chat-send">SEND</button>
            </form>
          </section>
        </div>

        <!-- Right flank: the period / after-school card, plus any pending
             approval. Both are filled entirely by app.js — see
             renderPeriodCard. Empty here on purpose: a placeholder rendered in
             markup would flash the wrong period for one frame on every load. -->
        <div class="home-side hud-flank">
          <section class="panel period-card" id="period-card" hidden></section>

          <section class="panel hidden" id="pending-panel">
            <h2>PENDING APPROVALS</h2>
            <div id="pending-list"></div>
          </section>
        </div>
      </div>

      <!-- Reads the same /api/status poll the drawer footer does; see
           updateSidebar, which writes both and tolerates either being absent
           because only one of them is ever in the DOM on a settings page. -->
      <div class="hud-status">
        <span class="dot" id="home-dot"></span>
        <span id="home-status">CONNECTING</span>
      </div>
    </div>

    <!-- Weather. Floats top-right, pinned to the viewport rather than stacked
         with the other panels — its own clock (ten minutes), see
         startWidgets. Collapsed to an icon and a temperature; hovering
         (desktop only — see the (hover: hover) query) enlarges it to the
         full reading, and a click/tap pins it open until a second click/tap,
         since touch has no hover to fall back on. Fails soft: a dead network
         renders a line of text in the expanded body, never an empty page. -->
    <div class="wx-widget" id="weather-widget">
      <div class="wx-compact" id="weather-compact">
        <span class="wx-compact-icon" id="wx-compact-icon">○</span>
        <span class="wx-compact-temp" id="wx-compact-temp">—°</span>
      </div>
      <div class="wx-expanded">
        <h2>WEATHER</h2>
        <div id="weather-body"><div class="hint">Loading…</div></div>
      </div>
    </div>
  </template>

  <template id="page-ai">
    <header class="page-header"><h1>AI MODEL</h1></header>

    <section class="panel">
      <label class="field-label">PROVIDER</label>
      <div class="segmented" id="seg-provider">
        <button data-value="ollama">OLLAMA</button>
        <button data-value="gemini">GEMINI</button>
      </div>
    </section>

    <section class="panel" id="panel-gemini">
      <h2>GEMINI</h2>
      <label class="field-label">API KEY</label>
      <div class="row">
        <input type="password" class="input" id="gemini-key" data-secret="1">
        <button class="btn btn-primary" id="gemini-key-save">Save</button>
      </div>
      <label class="field-label" style="margin-top: 16px;">MODEL</label>
      <select class="input" id="gemini-model"></select>
      <div class="hint" id="gemini-model-hint"></div>
    </section>

    <section class="panel" id="panel-ollama">
      <h2>OLLAMA</h2>
      <label class="field-label">BASE URL</label>
      <input type="text" class="input" id="ollama-url">
      <label class="field-label" style="margin-top: 12px;">MODEL</label>
      <input type="text" class="input" id="ollama-model">
    </section>

    <section class="panel">
      <label class="field-label">MAX TOKENS <span class="mono" id="maxtok-val">—</span></label>
      <input type="range" min="256" max="8192" step="128" class="slider" id="max-tokens">
    </section>
  </template>

  <template id="page-persona">
    <header class="page-header"><h1>PERSONA</h1></header>

    <section class="panel">
      <label class="field-label">PERSONALITY PRESET</label>
      <div class="preset-cards" id="preset-cards">
        <div class="preset-card" data-value="professional">
          <div class="preset-title">PROFESSIONAL</div>
          <div class="preset-desc">Concise and direct. No flair.</div>
        </div>
        <div class="preset-card" data-value="butler">
          <div class="preset-title">BUTLER</div>
          <div class="preset-desc">Formal. JARVIS-style phrasing enabled.</div>
        </div>
        <div class="preset-card" data-value="friday">
          <div class="preset-title">F.R.I.D.A.Y.</div>
          <div class="preset-desc">Full JARVIS mode. Dry wit unlocked.</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <label class="field-label">SNARK LEVEL</label>
      <div class="segmented" id="seg-snark">
        <button data-value="none">NONE</button>
        <button data-value="medium">MEDIUM</button>
        <button data-value="maximum">MAXIMUM</button>
      </div>
    </section>

    <section class="panel">
      <label class="field-label">CUSTOM INSTRUCTIONS</label>
      <textarea class="input" id="custom-instructions" rows="6"
        placeholder="Additional persona notes appended to AGENTS.md..."></textarea>
    </section>

    <section class="panel" id="panel-jarvis">
      <details class="phrases-details">
        <summary class="phrases-summary">
          <span class="chevron phrases-chevron">▸</span>
          <span id="phrases-count">Approved Phrases</span>
        </summary>
        <div id="jarvis-phrases"></div>
      </details>
    </section>

    <!-- Phrases Friday learned over Telegram. There is no approval card on
         add_quip, so this panel is the undo path for a phrase mangled by voice
         transcription. -->
    <section class="panel" id="panel-learned">
      <h2>LEARNED PHRASES</h2>
      <div class="row">
        <input class="input" id="learned-input" type="text"
               placeholder="Add a phrase Friday should use" maxlength="200">
        <button class="btn btn-outline btn-sm" id="learned-add">ADD</button>
      </div>
      <div id="learned-error" class="field-label hidden"></div>
      <div id="learned-phrases"></div>
    </section>
  </template>

  <template id="page-integrations">
    <header class="page-header"><h1>INTEGRATIONS</h1></header>

    <section class="panel">
      <h2>TELEGRAM</h2>
      <label class="field-label">BOT TOKEN</label>
      <div class="row">
        <input type="password" class="input" id="tg-token" data-secret="1">
        <button class="btn btn-primary" id="tg-token-save">Save</button>
      </div>
      <label class="field-label" style="margin-top: 12px;">CHAT ID</label>
      <input type="text" class="input" id="tg-chat">
      <div class="row" style="margin-top: 16px;">
        <button class="btn btn-teal" id="tg-test">Test Connection</button>
        <span class="hint" id="tg-test-result"></span>
      </div>
    </section>

    <section class="panel">
      <h2>GROUPME</h2>
      <label class="field-label">API TOKEN</label>
      <div class="row">
        <input type="password" class="input" id="gm-token" data-secret="1">
        <button class="btn btn-primary" id="gm-token-save">Save</button>
      </div>
      <div class="row" style="margin-top: 16px;">
        <button class="btn btn-teal" id="gm-fetch">Fetch My Groups</button>
        <span class="hint" id="gm-fetch-result"></span>
      </div>
      <div id="gm-groups" class="group-cards"></div>
    </section>

    <section class="panel">
      <h2>CANVAS</h2>
      <label class="field-label">iCAL URL</label>
      <input type="text" class="input" id="canvas-url">
      <label class="field-label" style="margin-top: 12px;">API TOKEN</label>
      <div class="row">
        <input type="password" class="input" id="canvas-token" data-secret="1">
        <button class="btn btn-primary" id="canvas-token-save">Save</button>
      </div>
      <div class="row" style="margin-top: 16px;">
        <button class="btn btn-teal" id="canvas-test">Test Connection</button>
        <span class="hint" id="canvas-test-result"></span>
      </div>
    </section>

    <section class="panel">
      <h2>WEATHER</h2>
      <div class="notif-row">
        <div>
          <div class="notif-label">USE MACHINE LOCATION</div>
          <div class="hint">Wi-Fi positioning on the Mac when available, IP-level
            otherwise. Off pins the city below instead.</div>
        </div>
        <label class="switch"><input type="checkbox" id="wx-use-machine"><span class="slider-sw"></span></label>
      </div>
      <label class="field-label" style="margin-top: 12px;" id="wx-location-label">LOCATION</label>
      <input type="text" class="input" id="wx-location" placeholder="Pensacola,US">
      <div class="hint" id="wx-location-hint">"City,CC" — the format OpenWeatherMap expects.</div>
      <label class="field-label" style="margin-top: 12px;">OPENWEATHERMAP API KEY</label>
      <div class="row">
        <input type="password" class="input" id="wx-key" data-secret="1">
        <button class="btn btn-primary" id="wx-key-save">Save</button>
      </div>
      <div class="hint">Also answers weather questions in chat, offline of the model.</div>
    </section>

    <section class="panel">
      <h2>MARKETS</h2>
      <div class="notif-row">
        <div class="notif-label">SHOW MARKETS WIDGET</div>
        <label class="switch"><input type="checkbox" id="mk-enabled"><span class="slider-sw"></span></label>
      </div>
      <label class="field-label" style="margin-top: 12px;">TICKERS</label>
      <div class="row">
        <input type="text" class="input" id="mk-tickers"
               placeholder="AAPL, MSFT, NVDA, SPY">
        <button class="btn btn-primary" id="mk-save">Save</button>
      </div>
      <div id="mk-chips" class="ticker-chips"></div>
      <div class="hint">
        Yahoo symbols, comma separated, twelve maximum — <span class="mono">AAPL</span>,
        <span class="mono">BRK.B</span>, <span class="mono">^GSPC</span> for an index,
        <span class="mono">BTC-USD</span> for crypto. No API key needed.
      </div>
      <div id="mk-error" class="field-label hidden"></div>
    </section>

    <section class="panel">
      <h2>GMAIL</h2>
      <div class="hint">
        School Gmail is currently inaccessible via API — third-party sign-in is
        locked down and forwarding is disabled. This integration is deferred
        until a clean access path becomes available.
      </div>
    </section>
  </template>

  <!-- The setup flow for the period card. Meant to be used once and then
       forgotten, which is why it lives on its own page rather than on the
       card itself. -->
  <template id="page-schedule">
    <header class="page-header"><h1>SCHEDULE</h1></header>

    <section class="panel">
      <h2>CANVAS COURSES</h2>
      <div class="hint" id="courses-hint">Loading…</div>
      <div id="course-list" class="course-list"></div>
    </section>

    <section class="panel">
      <h2>PERIODS</h2>
      <div class="hint">
        Set the bell times and assign a Canvas course to each period.
        4th and 5th are <strong>one slot</strong> — the same hour is 4th on an
        A day and 5th on a B day, so it takes one time and two courses.
        Leaving a period unassigned is fine.
      </div>
      <div id="period-rows"></div>
    </section>

    <section class="panel">
      <h2>A/B ROTATION</h2>
      <div class="hint">
        The rotation advances by <strong>school days</strong>, not calendar
        dates, so weekends do not flip it. There is no holiday calendar —
        when the school drifts, override today's letter below.
      </div>
      <div class="sched-row">
        <label class="field-label">FIRST A DAY</label>
        <input type="date" class="input" id="ab-start">
      </div>
      <div class="hint" id="ab-status"></div>
      <div class="sched-row" style="margin-top: 12px;">
        <label class="field-label">TODAY IS</label>
        <div class="segmented" id="ab-override">
          <button data-letter="A">A DAY</button>
          <button data-letter="B">B DAY</button>
          <button data-letter="clear">AUTO</button>
        </div>
      </div>
      <div class="hint">An override applies to today only and clears at midnight.</div>
    </section>

    <section class="panel">
      <h2>AFTER SCHOOL</h2>
      <div class="sched-row">
        <label class="field-label">BEDTIME</label>
        <input type="time" class="input" id="sched-bedtime">
      </div>
      <div class="hint">The far end of the free-time math on the after-school card.</div>
    </section>
  </template>

  <template id="page-calendar">
    <header class="page-header"><h1>CALENDAR</h1></header>

    <section class="panel">
      <label class="field-label">DEFAULT APPLE CALENDAR</label>
      <input type="text" class="input" id="default-calendar">
    </section>

    <section class="panel">
      <h2>GOOGLE CALENDAR SYNC</h2>
      <div class="hint">One-way mirror Google → Apple. Add a row per calendar.</div>
      <div id="gcal-list"></div>
      <button class="btn btn-outline" id="gcal-add" style="margin-top: 12px;">+ Add Calendar</button>
    </section>
  </template>

  <template id="page-notifications">
    <header class="page-header"><h1>NOTIFICATIONS</h1></header>

    <section class="panel">
      <div class="notif-row">
        <div>
          <div class="notif-label">MORNING BRIEFING</div>
          <input type="time" class="input small" id="morning-time">
        </div>
        <label class="switch"><input type="checkbox" id="morning-enabled"><span class="slider-sw"></span></label>
      </div>
      <div class="notif-row">
        <div>
          <div class="notif-label">EVENING BRIEFING</div>
          <input type="time" class="input small" id="evening-time">
        </div>
        <label class="switch"><input type="checkbox" id="evening-enabled"><span class="slider-sw"></span></label>
      </div>
    </section>

    <section class="panel">
      <div class="notif-row">
        <div class="notif-label">PROACTIVE REMINDERS</div>
        <label class="switch"><input type="checkbox" id="proactive"><span class="slider-sw"></span></label>
      </div>
      <div class="notif-row">
        <div class="notif-label">URGENT INTERRUPTS</div>
        <label class="switch"><input type="checkbox" id="urgent"><span class="slider-sw"></span></label>
      </div>
      <div class="notif-row">
        <div class="notif-label">CANVAS POLLING</div>
        <label class="switch"><input type="checkbox" id="canvas-poll"><span class="slider-sw"></span></label>
      </div>
      <div class="notif-row">
        <div class="notif-label">GROUPME POLLING</div>
        <label class="switch"><input type="checkbox" id="groupme-poll"><span class="slider-sw"></span></label>
      </div>
    </section>

    <section class="panel">
      <label class="field-label">REMINDER THRESHOLDS (DAYS OUT)</label>
      <div class="checkbox-row">
        <label><input type="checkbox" data-day="5"><span>5 days</span></label>
        <label><input type="checkbox" data-day="3"><span>3 days</span></label>
        <label><input type="checkbox" data-day="1"><span>1 day</span></label>
      </div>
    </section>
  </template>

  <template id="page-power">
    <header class="page-header"><h1>WAKE SCHEDULE</h1></header>

    <section class="panel">
      <div class="notif-row">
        <div>
          <div class="notif-label">WAKE FOR PASSING PERIODS</div>
          <div class="hint">Keeps the Mac reachable for a few minutes around
            each bell, with the lid shut. Costs battery — see below.</div>
        </div>
        <label class="switch"><input type="checkbox" id="power-enabled"><span class="slider-sw"></span></label>
      </div>
    </section>

    <section class="panel">
      <h2>STATUS</h2>
      <div class="power-status-row">
        <span class="dot" id="power-dot"></span>
        <span id="power-status-text" class="mono">—</span>
      </div>
      <div class="power-stat-grid">
        <div>
          <div class="field-label">BATTERY</div>
          <div id="power-battery" class="mono">—</div>
        </div>
        <div>
          <div class="field-label">NEXT SCHEDULED WAKE</div>
          <div id="power-next-wake" class="mono">—</div>
        </div>
      </div>
      <div class="hint hidden" id="power-sudo-hint"></div>
    </section>

    <section class="panel">
      <div class="notif-row">
        <div>
          <div class="notif-label">WAKE FOR BRIEFINGS</div>
          <div class="hint">Wakes the Mac a few minutes before each briefing so
            it is not asleep when one is due, then lets it sleep again as soon
            as the briefing sends. This is the main reason to schedule wakes at
            all; it works whether or not the passing-period schedule below is on.</div>
        </div>
        <label class="switch"><input type="checkbox" id="power-briefing-wakes"><span class="slider-sw"></span></label>
      </div>
      <div id="power-briefing-list"></div>
      <div class="notif-row">
        <div class="notif-label">WAKE THIS MANY MINUTES BEFORE</div>
        <input type="number" class="input small" id="power-briefing-lead" min="0" max="30">
      </div>
      <div class="notif-row" style="border-bottom:none;">
        <div>
          <div class="notif-label">GIVE UP AFTER</div>
          <div class="hint">How long to keep holding if the briefing never
            sends. The hold normally ends the moment it does.</div>
        </div>
        <input type="number" class="input small" id="power-briefing-grace" min="1" max="120">
      </div>
    </section>

    <section class="panel">
      <h2>MANUAL HOLD</h2>
      <div class="hint">Force the machine awake regardless of the schedule
        below, for a set duration. Overrides the schedule; does not disable it.</div>
      <div class="power-manual-row">
        <input type="number" class="input small" id="power-manual-minutes" min="1" max="480" value="30">
        <span class="mono">min</span>
        <button class="btn btn-primary" id="power-manual-start">Hold awake</button>
        <button class="btn btn-outline hidden" id="power-manual-clear">End hold</button>
      </div>
    </section>

    <section class="panel">
      <h2>DERIVED FROM THE BELL SCHEDULE</h2>
      <div class="hint">Computed from the Schedule page's period times — the
        gap between one period's end and the next one's start, when that gap
        is short enough to be a passing period rather than lunch. Read-only —
        edit period times on the Schedule page and these follow automatically;
        the switch above turns the whole set on and off.</div>
      <div id="power-derived-list"></div>
    </section>

    <section class="panel">
      <h2>CUSTOM BLOCKS</h2>
      <div class="hint">Anything beyond the derived passing periods — after
        school, evening study time.</div>
      <div id="power-custom-list"></div>
      <button class="btn btn-outline" id="power-custom-add" style="margin-top: 12px;">+ Add Block</button>
    </section>

    <section class="panel">
      <h2>ADVANCED</h2>
      <div class="notif-row">
        <div class="notif-label">WAKE THIS MANY MINUTES EARLY</div>
        <input type="number" class="input small" id="power-lead-minutes" min="0" max="15">
      </div>
      <div class="notif-row">
        <div class="notif-label">DAYS TO SCHEDULE AHEAD</div>
        <input type="number" class="input small" id="power-days-ahead" min="1" max="7">
      </div>
    </section>

    <section class="panel">
      <h2>ONE-TIME SETUP</h2>
      <div class="hint">Waking the machine and holding it awake both need
        root. This dashboard never edits sudoers for you — add this line
        yourself with <code>sudo visudo</code>:</div>
      <textarea class="input mono" id="power-sudoers-line" rows="3" readonly></textarea>
    </section>
  </template>

  <template id="page-voice">
    <header class="page-header"><h1>VOICE</h1></header>

    <section class="panel status-hero">
      <div class="hero-indicator">
        <div class="pulse" id="voice-pulse"></div>
        <div class="hero-text" id="voice-status">— — —</div>
      </div>
      <div class="hero-actions">
        <button class="btn btn-teal" id="voice-restart">Restart Voice</button>
        <button class="btn btn-outline" id="voice-logs-btn">View Logs</button>
      </div>
    </section>

    <section class="panel">
      <h2>SESSION</h2>
      <div class="notif-row">
        <div class="notif-label">TELETHON SESSION</div>
        <span class="mono" id="voice-session-state">—</span>
      </div>
      <div class="hint" id="voice-session-hint">
        Session blob is stored in <span class="mono">friday_config.yaml</span>. If
        rejected, stop the LaunchAgent and run
        <span class="mono">python voice/bridge.py</span> in a Terminal to re-auth.
      </div>
    </section>

    <section class="panel">
      <h2>TRIGGERS</h2>
      <div class="notif-row">
        <div class="notif-label">VOICE ENABLED</div>
        <label class="switch"><input type="checkbox" id="v-enabled"><span class="slider-sw"></span></label>
      </div>
      <div class="notif-row">
        <div class="notif-label">MICROPHONE ENABLED</div>
        <label class="switch"><input type="checkbox" id="v-mic"><span class="slider-sw"></span></label>
      </div>
      <div class="notif-row">
        <div>
          <div class="notif-label">PUSH-TO-TALK KEY</div>
          <div class="hint">e.g. right_option, left_option, f13, right_cmd</div>
        </div>
        <input type="text" class="input small" id="v-ptt-key" style="max-width: 180px;">
      </div>
      <div class="notif-row">
        <div>
          <div class="notif-label">WAKE WORD</div>
          <div class="hint">Dormant alternative path. PTT is primary.</div>
        </div>
        <label class="switch"><input type="checkbox" id="v-wake"><span class="slider-sw"></span></label>
      </div>
      <div class="notif-row">
        <div>
          <div class="notif-label">CLAP DETECTOR</div>
          <div class="hint">Dormant alternative path. PTT is primary.</div>
        </div>
        <label class="switch"><input type="checkbox" id="v-clap"><span class="slider-sw"></span></label>
      </div>
    </section>

    <section class="panel">
      <h2>OUTPUT</h2>
      <div class="notif-row">
        <div>
          <div class="notif-label">ALWAYS SPEAK</div>
          <div class="hint">Otherwise TTS only fires when external audio (headphones/AirPlay) is present.</div>
        </div>
        <label class="switch"><input type="checkbox" id="v-always-speak"><span class="slider-sw"></span></label>
      </div>
      <div class="notif-row">
        <div class="notif-label">WHISPER MODEL</div>
        <select class="input small" id="v-whisper" style="max-width: 180px;">
          <option value="tiny">tiny</option>
          <option value="base">base</option>
          <option value="small">small</option>
          <option value="medium">medium</option>
        </select>
      </div>
    </section>

    <div class="modal-backdrop hidden" id="voice-logs-modal">
      <div class="modal">
        <header><h2>VOICE.ERR</h2><button class="modal-close" id="voice-logs-close">×</button></header>
        <pre id="voice-logs-body"></pre>
      </div>
    </div>
  </template>

  <template id="page-about">
    <header class="page-header"><h1>ABOUT</h1></header>

    <section class="panel">
      <div class="about-row"><span class="field-label">VERSION</span><span class="mono">F.R.I.D.A.Y. v0.7</span></div>
      <div class="about-row"><span class="field-label">SERVER</span><span class="mono" id="about-server">http://127.0.0.1:5174</span></div>
      <div class="about-row hidden" id="about-update-row"><span class="field-label">LAST UPDATE</span><span class="mono" id="about-update">—</span></div>
    </section>

    <section class="panel">
      <h2>QUICK ACTIONS</h2>
      <div class="row">
        <button class="btn btn-outline" id="about-restart">Restart Friday</button>
        <button class="btn btn-teal" id="about-logs">View Logs</button>
      </div>
    </section>

    <div class="modal-backdrop hidden" id="logs-modal">
      <div class="modal">
        <header><h2>FRIDAY.LOG</h2><button class="modal-close" id="logs-close">×</button></header>
        <pre id="logs-body"></pre>
      </div>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
