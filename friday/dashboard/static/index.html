<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>F.R.I.D.A.Y.</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">

  <!-- Installable. On the Mac this becomes a dock icon and a chrome-less
       window; on the phone, a home-screen app. That is most of what makes the
       dashboard feel like the thing rather than a browser tab it is easy to
       lose behind twenty others.

       crossorigin="use-credentials" is load-bearing: a manifest is fetched
       with credentials OMITTED by default, and every route here needs the auth
       cookie. Without it the manifest 401s and the install prompt never
       appears — with no error anywhere the user can see. -->
  <link rel="manifest" href="/static/manifest.webmanifest" crossorigin="use-credentials">
  <meta name="theme-color" content="#04141B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Friday">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="saved-flash"></div>

  <!-- Today is the homepage; everything else lives behind this settings
       button as an off-canvas drawer, on every viewport width — not just
       mobile.

       The button is a lone fixed element, not a child of a header bar:
       there is no bar any more. It cannot live inside the ticker either,
       even though that is where it visually sits — the ticker belongs to
       the Today template and is cloned away on every settings page, and a
       settings drawer you can only open from the homepage is a trap.
       Fixed at the top-left it lands inside the ticker’s own left fade on
       Today, and floats over the page everywhere else.

       The F.R.I.D.A.Y. wordmark that used to sit beside it is gone: the
       hub in the middle of Today carries the name, at the size it
       deserves. Its other job — getting back to Today from a settings
       page — is now the first item in the drawer. -->
  <button class="settings-btn" id="hamburger-btn" aria-label="Open settings" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="logo">SETTINGS</div>
    <div class="logo-sub">CONFIGURATION</div>
    <nav>
      <a class="nav-item" data-route="today">Today</a>
      <a class="nav-item" data-route="ai">AI Model</a>
      <a class="nav-item" data-route="persona">Persona</a>
      <a class="nav-item" data-route="integrations">Integrations</a>
      <a class="nav-item" data-route="schedule">Schedule</a>
      <a class="nav-item" data-route="calendar">Calendar</a>
      <a class="nav-item" data-route="notifications">Notifications</a>
      <a class="nav-item" data-route="power">Wake Schedule</a>
      <a class="nav-item" data-route="voice">Voice</a>
      <a class="nav-item" data-route="about">About</a>
    </nav>
    <div class="sidebar-footer">
      <span class="dot" id="sidebar-dot"></span>
      <span id="sidebar-status">CONNECTING</span>
    </div>
  </aside>

  <main id="page"></main>

  <!-- ─── Page templates ────────────────────────────────────────────────── -->

  <template id="page-today">
    <!-- The ticker tape. Full-bleed against main's own padding (see the CSS
         note on .ticker-marquee) rather than boxed in a panel — a scrolling
         strip with visible edges reads as a broken widget, not a ticker.
         Hidden until the first fetch answers, so an empty strip never
         flashes before there is anything to show. -->
    <div class="ticker-marquee hidden" id="ticker-marquee">
      <div class="ticker-track" id="ticker-track"></div>
    </div>

    <!-- The visor: the schedule card on the left, the hub and the
         conversation in the middle, the to-do list on the right. Nothing is
         rotated and nothing is framed — the panels' own corner brackets are
         the only structure. .hud-stage is the positioning context the ONLINE
         strip anchors to. -->
    <div class="hud-stage">
      <div class="home-grid">
        <!-- Left flank. Nothing populates the list yet — deliberately blank,
             same footprint as the card on the other side so the visor stays
             symmetric about the hub. -->
        <div class="home-todo hud-flank">
          <section class="panel">
            <h2>TO-DO LIST</h2>
            <div id="todo-list"></div>
          </section>
        </div>

        <div class="home-center">
          <!-- The hub. Two layers over one state.

               Inside out: the wordmark, then the concentric rings and tick
               collar, then the bar ring standing on the outermost ring's edge
               and growing outward.

               They answer the same three states in two different registers.
               The rings are the object — they counter-rotate, and the rate
               steps up through idle, thinking and speaking. The bars are the
               voice — a travelling wave whose amplitude and wavelength change
               with the state, plus one bright crest per arriving event. One
               is what Friday IS; the other is what Friday is DOING, and the
               reason they are two layers rather than one is that those are
               two different questions and only one of them has an answer that
               changes second to second.

               The whole stack is 0.72x the radii it had before the bars
               arrived, so adding a layer outside it did not grow the mark:
               rings top out at r=173.75 and the bars run 176 to 247.4 at
               their loudest, inside a 512 viewBox.

               Geometry only below — every colour, rate and keyframe is in
               style.css under "The hub". data-state is written by hubState()
               in app.js; the beat is .hub-beat, applied per arriving event by
               hubBeat(). -->
          <div class="hub" id="hub" data-state="idle">
            <svg class="hub-mark" id="hub-svg" viewBox="0 0 512 512"
                 role="img" aria-labelledby="hub-title" focusable="false">
              <title id="hub-title">J.A.R.V.I.S.</title>

              <defs>
                <radialGradient id="hub-halo-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="42%" class="hub-halo-in"/>
                  <stop offset="74%" class="hub-halo-mid"/>
                  <stop offset="100%" class="hub-halo-out"/>
                </radialGradient>
                <radialGradient id="hub-core-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%"   class="hub-core-in"/>
                  <stop offset="100%" class="hub-core-out"/>
                </radialGradient>
                <radialGradient id="hub-plate-grad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%"   class="hub-plate-in"/>
                  <stop offset="60%"  class="hub-plate-mid"/>
                  <stop offset="100%" class="hub-plate-out"/>
                </radialGradient>
              </defs>

              <!-- Halo and bloom. Static paint, deliberately NOT an SVG
                   filter: a blur over a group re-runs every frame its
                   children transform, and here that is four rotating rings
                   AND 90 bars. Only opacity animates. -->
              <circle cx="256" cy="256" r="256" fill="url(#hub-halo-grad)"/>
              <g class="hub-bloom" fill="none">
                <circle cx="256" cy="256" r="171"/>
                <circle cx="256" cy="256" r="108"/>
              </g>

              <!-- ── Layer 1: the outer ring. Turns clockwise. ── -->
              <g class="hub-layer hub-outer" fill="none">
                <circle class="hub-ring-heavy" cx="256" cy="256" r="171"
                        stroke-dasharray="244 24.61" stroke-linecap="butt"/>
                <circle class="hub-ring-thin" cx="256" cy="256" r="164"
                        stroke-dasharray="309 34.48"/>
                <!-- The three beads on the left flank and the notch at the
                     foot: the two asymmetries that stop the outer ring
                     reading as a plain circle. -->
                <g class="hub-bead"><circle cx="97.6" cy="278.3" r="3"/><circle cx="96.0" cy="256.0" r="3"/><circle cx="97.6" cy="233.7" r="3"/></g>
                <path class="hub-notch" d="M 230 435 L 243 422 L 269 422 L 282 435"/>
              </g>

              <!-- ── Layer 2: the tick collar. Turns anticlockwise. ──
                   60 fine ticks at r=148 and 24 long ones at r=130; each dash
                   array is that circle's circumference divided by the tick
                   count, which is what makes one stroked circle read as sixty
                   radial marks. -->
              <g class="hub-layer hub-ticks" fill="none">
                <circle class="hub-tick-fine" cx="256" cy="256" r="148"
                        stroke-dasharray="4.5 11"/>
                <circle class="hub-tick-long" cx="256" cy="256" r="130"
                        stroke-dasharray="3.6 30.43"/>
                <circle class="hub-ring-thin" cx="256" cy="256" r="138"/>
              </g>

              <!-- ── Layer 3: the inner band. Turns clockwise, faster. ── -->
              <g class="hub-layer hub-inner" fill="none">
                <circle class="hub-band-fill" cx="256" cy="256" r="108"/>
                <circle class="hub-band-seg" cx="256" cy="256" r="108"
                        stroke-dasharray="115 20.72"/>
                <circle class="hub-ring-bright" cx="256" cy="256" r="98"/>
                <g class="hub-dot"><circle cx="194.1" cy="167.5" r="3.6"/><circle cx="219.1" cy="154.5" r="3.6"/><circle cx="246.6" cy="148.4" r="3.6"/><circle cx="274.8" cy="149.6" r="3.6"/></g>
              </g>

              <!-- ── Layer 4: the segmented track. Turns anticlockwise. ── -->
              <g class="hub-layer hub-seg" fill="none">
                <circle class="hub-seg-block" cx="256" cy="256" r="79"
                        stroke-dasharray="10 7.73"/>
                <circle class="hub-ring-thin" cx="256" cy="256" r="85"/>
                <circle class="hub-seg-fine" cx="256" cy="256" r="68"
                        stroke-dasharray="2.2 4.4"/>
              </g>

              <!-- ── Layer 5: four fixed arcs, in the one clear annulus the
                   compressed stack leaves (155.5 to 163.2). They do not turn
                   and they do not carry the beat any more — the bars own that
                   now. What is left is a standing pulse per state, which is
                   the ring stack's own answer to "is anything happening". -->
              <g class="hub-arcs" fill="none">
                  <path d="M 106.6 201.6 A 159 159 0 0 1 201.6 106.6"/>
                  <path d="M 310.4 106.6 A 159 159 0 0 1 405.4 201.6"/>
                  <path d="M 405.4 310.4 A 159 159 0 0 1 310.4 405.4"/>
                  <path d="M 201.6 405.4 A 159 159 0 0 1 106.6 310.4"/>
              </g>

              <!-- The accent arc on the left flank. The original mark's was
                   amber; the page owns no amber, and a logo lit in a colour
                   nothing else on screen uses reads as a broken asset rather
                   than an accent. --az2 is the same gesture in a colour the
                   palette already has. -->
              <path class="hub-accent" fill="none" d="M 128.2 315.6 A 141 141 0 0 1 128.2 196.4"/>

              <!-- ── Layer 6: the bar ring. ──────────────────────────────
                   90 bars on a 4-degree pitch standing on r=176, just
                   clear of the outer ring's edge at 173.75, and growing
                   outward. Three nested elements per bar, each owning one
                   job:

                     .hub-slot   static placement. An SVG transform ATTRIBUTE,
                                 not a CSS one — a CSS transform here would
                                 override the attribute, and the rotation has
                                 to survive both animations beneath it.
                     .hub-bar    the travelling wave (scaleY).
                     .hub-tip    the beat (scaleY + colour).

                   Two nested scaleY multiply, so the beat rides the wave
                   instead of replacing it. That is the whole reason for the
                   third level: two independent geometric animations cannot
                   share one element's transform.

                   --i is the bar index and the ONLY per-bar value. Phase is
                   computed from it in style.css, so the wavelength is a
                   stylesheet number rather than something baked into 90 lines
                   of markup. -->
              <g class="hub-bars">
                  <g class="hub-slot" transform="rotate(0 256 256)" style="--i:0"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>
                  <g class="hub-slot" transform="rotate(4 256 256)" style="--i:1"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>
                  <g class="hub-slot" transform="rotate(8 256 256)" style="--i:2"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>
                  <g class="hub-slot" transform="rotate(12 256 256)" style="--i:3"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>
                  <g class="hub-slot" transform="rotate(16 256 256)" style="--i:4"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>
                  <g class="hub-slot" transform="rotate(20 256 256)" style="--i:5"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>
                  <g class="hub-slot" transform="rotate(24 256 256)" style="--i:6"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>
                  <g class="hub-slot" transform="rotate(28 256 256)" style="--i:7"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>
                  <g class="hub-slot" transform="rotate(32 256 256)" style="--i:8"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>
                  <g class="hub-slot" transform="rotate(36 256 256)" style="--i:9"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>
                  <g class="hub-slot" transform="rotate(40 256 256)" style="--i:10"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>
                  <g class="hub-slot" transform="rotate(44 256 256)" style="--i:11"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>
                  <g class="hub-slot" transform="rotate(48 256 256)" style="--i:12"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>
                  <g class="hub-slot" transform="rotate(52 256 256)" style="--i:13"><g class="hub-bar"><rect class="hub-tip" x="254.2" y="63" width="3.6" height="17" rx="1.8"/></g></g>

          <!-- Chat. The same conversation as Telegram, over loopback, so it
               works with the Wi-Fi switched off — which is most of the school

               the composer is a single lit underline. -->

              <div class="hint">Loading…</div>
            </div>
            <form class="chat-composer" id="chat-form" autocomplete="off">

        <!-- Right flank: the period / after-school card, plus any pending
             approval. Both are filled entirely by app.js — see
             renderPeriodCard. Empty here on purpose: a placeholder rendered in
             markup would flash the wrong period for one frame on every load. -->
        <div class="home-side hud-flank">
          <section class="panel period-card" id="period-card" hidden></section>

          <section class="panel hidden" id="pending-panel">
            <h2>PENDING APPROVALS</h2>
            <div id="pending-list"></div>
          </section>
        </div>
      </div>

      <!-- Reads the same /api/status poll the drawer footer does; see
           updateSidebar, which writes both and tolerates either being absent
           because only one of them is ever in the DOM on a settings page. -->
      <div class="hud-status">
        <span class="dot" id="home-dot"></span>
        <span id="home-status">CONNECTING</span>
      </div>
    </div>

    <!-- Weather. Seated into the far-right end of the ticker band — same top
         edge, same height, flush to the viewport corner — so at rest it reads
         as the right-hand end of the bar rather than a card floating over it.
         Its own clock (ten minutes), see startWidgets.

         Clicking the readout sweeps it left across the whole bar and drops it
         open with the full reading, covering the tickers. It stops short of
         the settings button, which stays visible throughout. Closed by the
         ×, by Escape, or by a click anywhere outside it.

         The compact readout is a real <button> so the disclosure is reachable
         from the keyboard at all — it was a bare div with a click listener,
         which no amount of CSS makes operable. Fails soft: a dead network
         renders a line of text in the expanded body, never an empty page. -->
    <div class="wx-widget" id="weather-widget">
      <button class="wx-compact" id="weather-toggle"
              aria-expanded="false" aria-controls="weather-panel"
              aria-label="Weather — open the full reading">
        <span class="wx-compact-icon" id="wx-compact-icon">○</span>
        <span class="wx-compact-temp" id="wx-compact-temp">—°</span>
      </button>
      <div class="wx-expanded" id="weather-panel">
        <h2>WEATHER</h2>
        <div class="wx-body" id="weather-body"><div class="hint">Loading…</div></div>
      </div>
    </div>

        <div>
          <div class="field-label">NEXT SCHEDULED WAKE</div>
          <div id="power-next-wake" class="mono">—</div>
        </div>
      </div>
      <div class="hint hidden" id="power-sudo-hint"></div>
    </section>

    <section class="panel">
      <div class="notif-row">
        <div>
          <div class="notif-label">WAKE FOR BRIEFINGS</div>
          <div class="hint">Wakes the Mac a few minutes before each briefing so
            it is not asleep when one is due, then lets it sleep again as soon
            as the briefing sends. This is the main reason to schedule wakes at
            all; it works whether or not the passing-period schedule below is on.</div>
        </div>
        <label class="switch"><input type="checkbox" id="power-briefing-wakes"><span class="slider-sw"></span></label>
      </div>
      <div id="power-briefing-list"></div>
      <div class="notif-row">
        <div class="notif-label">WAKE THIS MANY MINUTES BEFORE</div>
        <input type="number" class="input small" id="power-briefing-lead" min="0" max="30">
      </div>
      <div class="notif-row" style="border-bottom:none;">
        <div>
          <div class="notif-label">GIVE UP AFTER</div>
          <div class="hint">How long to keep holding if the briefing never
            sends. The hold normally ends the moment it does.</div>
        </div>
        <input type="number" class="input small" id="power-briefing-grace" min="1" max="120">
      </div>
    </section>

    <section class="panel">
      <h2>MANUAL HOLD</h2>
      <div class="hint">Force the machine awake regardless of the schedule
        below, for a set duration. Overrides the schedule; does not disable it.</div>
      <div class="power-manual-row">
        <input type="number" class="input small" id="power-manual-minutes" min="1" max="480" value="30">
        <span class="mono">min</span>
        <button class="btn btn-primary" id="power-manual-start">Hold awake</button>
        <button class="btn btn-outline hidden" id="power-manual-clear">End hold</button>
      </div>
    </section>

    <section class="panel">
      <h2>DERIVED FROM THE BELL SCHEDULE</h2>
      <div class="hint">Computed from the Schedule page's period times — the
        gap between one period's end and the next one's start, when that gap
        is short enough to be a passing period rather than lunch. Read-only —
        edit period times on the Schedule page and these follow automatically;
        the switch above turns the whole set on and off.</div>
      <div id="power-derived-list"></div>
    </section>

    <section class="panel">
      <h2>CUSTOM BLOCKS</h2>
      <div class="hint">Anything beyond the derived passing periods — after
        school, evening study time.</div>
      <div id="power-custom-list"></div>
      <button class="btn btn-outline" id="power-custom-add" style="margin-top: 12px;">+ Add Block</button>
    </section>

    <section class="panel">
      <h2>ADVANCED</h2>
      <div class="notif-row">
        <div class="notif-label">WAKE THIS MANY MINUTES EARLY</div>
        <input type="number" class="input small" id="power-lead-minutes" min="0" max="15">
      </div>
      <div class="notif-row">
        <div class="notif-label">DAYS TO SCHEDULE AHEAD</div>
        <input type="number" class="input small" id="power-days-ahead" min="1" max="7">
      </div>
    </section>

    <section class="panel">
      <h2>ONE-TIME SETUP</h2>
      <div class="hint">Waking the machine and holding it awake both need
        root. This dashboard never edits sudoers for you — add this line
        yourself with <code>sudo visudo</code>:</div>
      <textarea class="input mono" id="power-sudoers-line" rows="3" readonly></textarea>
    </section>
  </template>

  <template id="page-voice">
    <header class="page-header"><h1>VOICE</h1></header>

    <section class="panel status-hero">
      <div class="hero-indicator">
        <div class="pulse" id="voice-pulse"></div>
        <div class="hero-text" id="voice-status">— — —</div>
      </div>
      <div class="hero-actions">
        <button class="btn btn-teal" id="voice-restart">Restart Voice</button>
        <button class="btn btn-outline" id="voice-logs-btn">View Logs</button>
      </div>
    </section>

    <section class="panel">
      <h2>SESSION</h2>
      <div class="notif-row">
        <div class="notif-label">TELETHON SESSION</div>
        <span class="mono" id="voice-session-state">—</span>
      </div>
      <div class="hint" id="voice-session-hint">
        Session blob is stored in <span class="mono">friday_config.yaml</span>. If
        rejected, stop the LaunchAgent and run
        <span class="mono">python voice/bridge.py</span> in a Terminal to re-auth.
      </div>
    </section>

    <section class="panel">
      <h2>TRIGGERS</h2>
      <div class="notif-row">
        <div class="notif-label">VOICE ENABLED</div>
        <label class="switch"><input type="checkbox" id="v-enabled"><span class="slider-sw"></span></label>
      </div>
      <div class="notif-row">
        <div class="notif-label">MICROPHONE ENABLED</div>
        <label class="switch"><input type="checkbox" id="v-mic"><span class="slider-sw"></span></label>
      </div>
      <div class="notif-row">
        <div>
          <div class="notif-label">PUSH-TO-TALK KEY</div>
          <div class="hint">e.g. right_option, left_option, f13, right_cmd</div>
        </div>
        <input type="text" class="input small" id="v-ptt-key" style="max-width: 180px;">
      </div>
      <div class="notif-row">
        <div>
          <div class="notif-label">WAKE WORD</div>
          <div class="hint">Dormant alternative path. PTT is primary.</div>
        </div>
        <label class="switch"><input type="checkbox" id="v-wake"><span class="slider-sw"></span></label>
      </div>
      <div class="notif-row">
        <div>
          <div class="notif-label">CLAP DETECTOR</div>
          <div class="hint">Dormant alternative path. PTT is primary.</div>
        </div>
        <label class="switch"><input type="checkbox" id="v-clap"><span class="slider-sw"></span></label>
      </div>
    </section>

    <section class="panel">
      <h2>OUTPUT</h2>
      <div class="notif-row">
        <div>
          <div class="notif-label">ALWAYS SPEAK</div>
          <div class="hint">Otherwise TTS only fires when external audio (headphones/AirPlay) is present.</div>
        </div>
        <label class="switch"><input type="checkbox" id="v-always-speak"><span class="slider-sw"></span></label>
      </div>
      <div class="notif-row">
        <div class="notif-label">WHISPER MODEL</div>
        <select class="input small" id="v-whisper" style="max-width: 180px;">
          <option value="tiny">tiny</option>
          <option value="base">base</option>
          <option value="small">small</option>
          <option value="medium">medium</option>
        </select>
      </div>
    </section>

    <div class="modal-backdrop hidden" id="voice-logs-modal">
      <div class="modal">
        <header><h2>VOICE.ERR</h2><button class="modal-close" id="voice-logs-close">×</button></header>
        <pre id="voice-logs-body"></pre>
      </div>
    </div>
  </template>

  <template id="page-about">
    <header class="page-header"><h1>ABOUT</h1></header>

    <section class="panel">
      <div class="about-row"><span class="field-label">VERSION</span><span class="mono">F.R.I.D.A.Y. v0.7</span></div>
      <div class="about-row"><span class="field-label">SERVER</span><span class="mono" id="about-server">http://127.0.0.1:5174</span></div>
      <div class="about-row hidden" id="about-update-row"><span class="field-label">LAST UPDATE</span><span class="mono" id="about-update">—</span></div>
    </section>

    <section class="panel">
      <h2>QUICK ACTIONS</h2>
      <div class="row">
        <button class="btn btn-outline" id="about-restart">Restart Friday</button>
        <button class="btn btn-teal" id="about-logs">View Logs</button>
      </div>
    </section>

    <div class="modal-backdrop hidden" id="logs-modal">
      <div class="modal">
        <header><h2>FRIDAY.LOG</h2><button class="modal-close" id="logs-close">×</button></header>
        <pre id="logs-body"></pre>
      </div>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
